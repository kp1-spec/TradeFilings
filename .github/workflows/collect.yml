name: Collect trade filings

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect, build dashboard, email digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python src/run.py
      - name: Save results back to the repo
        run: |
          git config user.name "trade-monitor"
          git config user.email "trade-monitor@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update filings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
